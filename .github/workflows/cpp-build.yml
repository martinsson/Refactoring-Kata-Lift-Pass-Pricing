name: cpp-build

on:
  push:
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-build.yml'
      
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-build.yml'

jobs:
  build_linux:

    runs-on: ubuntu-22.04

    env:
      DB_USER: root
      DB_OLD_PASSWORD: root
      DB_PASSWORD: mysql

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Start MYSQL
      run: sudo systemctl start mysql

    - name: Configure MYSQL and import DB
      run: |
        mysqladmin --user=${{ env.DB_USER }} --password=${{ env.DB_OLD_PASSWORD }} password ${{ env.DB_PASSWORD }}
        mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < ${GITHUB_WORKSPACE}/database/initDatabase.sql

    - name: Set up MYSQL Connector
      working-directory: cpp/mysqlcppconn
      run: |
        sudo apt-get -y update
        sudo apt-get -y install libmysqlcppconn-dev
        sudo dpkg -L libmysqlcppconn-dev

    - name: Build
      working-directory: cpp
      run: |
        mkdir build
        cd build
        cmake -G "Unix Makefiles" ..
        cmake --build .

    - name: Test
      working-directory: cpp
      run: |
        cd build
        ctest

  build_windows:

    runs-on: windows-latest

    env:
      DB_USER: root
      DB_OLD_PASSWORD:
      DB_PASSWORD: mysql

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Start MYSQL
      uses: shogo82148/actions-setup-mysql@v1.23.0
      with:
        mysql-version: "8.0"

    - name: Configure MYSQL and import DB
      run: |
        mysqladmin --user=${{ env.DB_USER }} --password=${{ env.DB_OLD_PASSWORD }} password ${{ env.DB_PASSWORD }}
        type .\database\initDatabase.sql | mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }}

    - name: Set up MYSQL Connector
      working-directory: cpp/mysqlcppconn
      run: |
        Invoke-WebRequest -Uri https://www.code-cop.org/mysqlcppconn/mysql-connector-c++-8.0.33-winx64-debug.zip -OutFile mysql-connector.zip
        Expand-Archive -Path mysql-connector.zip -DestinationPath .
        echo "${github_workspace}\cpp\mysqlcppconn\mysql-connector-c++-8.0.33-winx64\lib64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "${github_workspace}\cpp\mysqlcppconn\mysql-connector-c++-8.0.33-winx64\lib64\debug" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build
      working-directory: cpp
      run: |
        mkdir build
        cd build
        copy ..\mysqlcppconn\mysql-connector-c++-8.0.33-winx64\lib64\*.dll .
        copy ..\mysqlcppconn\mysql-connector-c++-8.0.33-winx64\lib64\debug\*.dll .
        cmake -G "Visual Studio 17 2022" ..
        cmake --build . --config Debug

    - name: Test
      working-directory: cpp
      run: |
        cd build
        ctest
