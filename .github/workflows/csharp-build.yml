name: csharp-build

on:
  push:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp-build.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp-build.yml'

jobs:
  build:
    defaults:
      run:
        working-directory: ./csharp

    runs-on: ubuntu-latest

    env:
      DB_USER: root
      DB_OLD_PASSWORD: root
      DB_PASSWORD: mysql

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Start MYSQL and import DB
        run: |
          sudo systemctl start mysql
          mysqladmin --user=${{ env.DB_USER }} --password=${{ env.DB_OLD_PASSWORD }} password ${{ env.DB_PASSWORD }}
          mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < ${GITHUB_WORKSPACE}/database/initDatabase.sql

      - name: Set up dotnet build
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x

      - name: install dependencies
        run: dotnet restore

      - name: build solution
        run: dotnet build

      - name: Smoke test
        run: |
          cd LiftPassPricing
          dotnet run &
          sleep 3
          wget -qO ./response.json "http://localhost:5000/prices?type=night&age=23&date=2019-02-18"
          pkill -f "dotnet"
          sleep 1
          cat response.json
          jq -e '. == {"cost":19}' response.json
