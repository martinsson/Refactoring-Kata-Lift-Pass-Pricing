name: scala-build

on:
  push:
    paths:
      - 'scala/**'
      - '.github/workflows/scala-build.yml'
  pull_request:
    paths:
      - 'scala/**'
      - '.github/workflows/scala-build.yml'

jobs:
  build:
    defaults:
      run:
        working-directory: ./scala

    runs-on: ubuntu-latest

    env:
      DB_USER: root
      DB_OLD_PASSWORD: root
      DB_PASSWORD: mysql
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Start MYSQL and import DB
      run: |
        sudo systemctl start mysql
        mysqladmin --user=${{ env.DB_USER }} --password=${{ env.DB_OLD_PASSWORD }} password ${{ env.DB_PASSWORD }}
        mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < ${GITHUB_WORKSPACE}/database/initDatabase.sql

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'sbt'

    - name: Set up Scala/sbt
      uses: sbt/setup-sbt@v1

    - name: Build and test
      run: sbt test

    - name: Smoke test
      run: |
        sbt run &
        sleep 8
        wget -qO ./response.json "http://localhost:5010/prices?type=night&age=23&date=2019-02-18"
        pkill -f "sbt"
        sleep 1
        cat response.json
        jq -e '. == {"cost":19}' response.json
