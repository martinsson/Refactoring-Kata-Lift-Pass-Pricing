name: php-simple-build

on:
  push:
    paths:
      - 'php-simple/**'
      - '.github/workflows/php-simple-build.yml'
  pull_request:
    paths:
      - 'php-simple/**'
      - '.github/workflows/php-simple-build.yml'

jobs:
  build:
    defaults:
      run:
        working-directory: ./php-simple

    runs-on: ubuntu-latest

    env:
      DB_USER: root
      DB_OLD_PASSWORD: root
      DB_PASSWORD: mysql

    strategy:
      matrix:
        php-version: ["8.0", "8.2", "8.4", "8.5"]
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Start MYSQL and import DB
      run: |
        sudo systemctl start mysql
        mysqladmin --user=${{ env.DB_USER }} --password=${{ env.DB_OLD_PASSWORD }} password ${{ env.DB_PASSWORD }}
        mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < ${GITHUB_WORKSPACE}/database/initDatabase.sql  

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}

    - name: Set up dependencies
      run: composer update

    - name: Test
      run: ./vendor/bin/phpunit

    - name: Smoke test
      run: |
        php -S localhost:8000 -t bootstrap &
        sleep 3
        wget -qO ./response.json "http://localhost:8000/prices?type=night&age=23&date=2019-02-18"
        pkill -f "localhost:8000"
        sleep 1
        cat response.json
        jq -e '. == {"cost":19}' response.json
