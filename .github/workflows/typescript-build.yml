name: typescript-buld

on:
  push:
    paths:
      - 'typescript/**'
      - '.github/workflows/typescript-build.yml'
  pull_request:
    paths:
      - 'typescript/**'
      - '.github/workflows/typescript-build.yml'

jobs:
  build:
    defaults:
      run:
        working-directory: ./typescript

    runs-on: ubuntu-latest

    env:
      DB_USER: root
      DB_OLD_PASSWORD: root
      DB_PASSWORD: mysql

    strategy:
      matrix:
        node-version: [10, 12, 14, 16, 20, 22, 24, 26]
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Start MYSQL and import DB
      run: |
        sudo systemctl start mysql
        mysqladmin --user=${{ env.DB_USER }} --password=${{ env.DB_OLD_PASSWORD }} password ${{ env.DB_PASSWORD }}
        mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < ${GITHUB_WORKSPACE}/database/initDatabase.sql  

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Set up dependencies
      run: npm install --force

    - name: Build and test
      run: |
        npm run compile
        npm test

    - name: Smoke test
      run: |
        node_modules/.bin/ts-node index.js &
        sleep 3
        wget -qO ./response.json "http://localhost:5010/prices?type=night&age=23&date=2019-02-18"
        pkill -f "index.js"
        sleep 1
        cat response.json
        jq -e '. == {"cost":19}' response.json
